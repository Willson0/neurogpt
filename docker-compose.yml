services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: .env
    # DB_HOST=host.docker.internal reaches a MySQL running on this server outside Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The database is set in .env (DB_HOST etc.). Empty DB_HOST = the local "db" container (profile local-db).
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-neurogpt}
      DB_USERNAME: ${DB_USERNAME:-neurogpt}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
        # With a remote database the local container is not started (no local-db profile).
        required: false

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: .env
    # DB_HOST=host.docker.internal reaches a MySQL running on this server outside Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The database is set in .env (DB_HOST etc.). Empty DB_HOST = the local "db" container (profile local-db).
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-neurogpt}
      DB_USERNAME: ${DB_USERNAME:-neurogpt}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - app
    user: www-data
    # Generations run here. Scale with: docker compose up -d --scale queue=3
    entrypoint: []
    command: ["php", "artisan", "queue:work", "--queue=high,default", "--tries=1", "--timeout=900", "--sleep=1", "--max-time=3600"]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: .env
    # DB_HOST=host.docker.internal reaches a MySQL running on this server outside Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The database is set in .env (DB_HOST etc.). Empty DB_HOST = the local "db" container (profile local-db).
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-neurogpt}
      DB_USERNAME: ${DB_USERNAME:-neurogpt}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - app
    user: www-data
    # Periodic jobs: stuck generations are refunded, stale payments expire. Exactly one instance.
    entrypoint: []
    command: ["php", "artisan", "schedule:work"]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - storage:/var/www/storage:ro
    depends_on:
      - app

  # Local MySQL. Started only with the profile "local-db" (COMPOSE_PROFILES=local-db in .env).
  # With a remote bot database remove that line; the volume keeps the old web app data for neurogpt:import-legacy.
  db:
    image: mysql:8.4
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-neurogpt}
      MYSQL_USER: ${DB_USERNAME:-neurogpt}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  storage:
