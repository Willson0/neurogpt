server {
    listen 80;
    server_name _;
    client_max_body_size 22m;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Security headers. nginx drops inherited add_header lines in a location that has its own, so they are repeated below.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Mini App (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }
    # Admin panel: a separate page with its own bundle
    location ~ ^/admin(\.html|/)?$ {
        try_files /admin.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    }

    # Generated files (shared volume with the app container)
    location /storage/ {
        alias /var/www/storage/app/public/;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; media-src 'self'; img-src 'self'; sandbox" always;
        # only media is served from here
        location ~* \.(php|phtml|html?|js|svg)$ { return 404; }
    }

    # Laravel API
    location /api/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 180s;
    }
    location = /up {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }
}
